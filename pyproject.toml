[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shapley-algorithm-example"
version = "0.1.0"
description = "A self-contained exact Shapley value example"
requires-python = ">=3.10"

[tool.setuptools]
py-modules = ["shapley"]
package-dir = {"" = "src"}
